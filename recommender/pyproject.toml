[project]
name = "recsys-prototype"
version = "0.1.0"
description = "Learning prototype of a marketplace recommender: candidates -> features -> ranker -> re-rank"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "lightgbm>=4.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
recsys = "recsys.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recsys"]
